[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cyberpod-core"
version = "0.1.0"
description = "Lab-agnostic CyberPod session engine and integration contracts"
requires-python = ">=3.12"
dependencies = ["aiohttp==3.13.5", "pydantic==2.13.5", "PyYAML==6.0.3"]

[project.scripts]
cyberpod-core = "cyberpod_core.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
