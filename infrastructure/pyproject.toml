[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cyberpod-infra"
version = "0.1.0"
description = "Astra #2: private Docker worker adapter for isolated CyberPod sessions"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
cyberpod-infra = "cyberpod_infra.__main__:main"

[tool.setuptools.packages.find]
include = ["cyberpod_infra*"]
