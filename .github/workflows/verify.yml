name: Verify integration
on: [push, pull_request]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e . -e infrastructure
      - run: python -m unittest discover -s tests -t . -v
      - run: python -m unittest discover -s infrastructure/tests -v
      - run: python -m cyberpod_integration --help
