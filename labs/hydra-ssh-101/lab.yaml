schema_version: "1.0"
id: hydra-ssh-101
name: Hydra Lab
description: Training lab for SSH recon and Hydra. Demo validator accepts the published flag only.
version: "1.0.0"
difficulty: beginner
estimated_duration_minutes: 20
session_timeout_seconds: 1200
required_tools:
  - nmap
  - hydra
resources:
  cpu: 0.5
  memory_mb: 128
  pids: 32
  storage_mb: 128
networks:
  - id: training
    scope: session
    internet: none
volumes:
  - id: scratch
    ephemeral: true
    size_mb: 32
containers:
  - id: target
    image: busybox:1.37.0
    role: target
    command: ["sh", "-c", "echo ready > /scratch/ready; sleep 86400"]
    networks: [training]
    resources:
      cpu: 0.5
      memory_mb: 128
      pids: 32
      storage_mb: 64
    mounts:
      - volume: scratch
        path: /scratch
    healthcheck:
      command: ["test", "-f", "/scratch/ready"]
      interval_seconds: 1
      timeout_seconds: 1
      retries: 10
    run_as: "1000:1000"
    read_only_rootfs: true
tasks:
  - id: recon
    title: Nmap recon
    instructions: nmap 10.8.0.22
    extensions:
      points: 20
  - id: identify
    title: Identify SSH
    instructions: services
    depends_on: [recon]
    extensions:
      points: 15
  - id: hydra
    title: Run Hydra
    instructions: hydra against the training target
    depends_on: [identify]
    extensions:
      points: 30
  - id: creds
    title: Recover credentials
    instructions: read hydra result
    depends_on: [hydra]
    extensions:
      points: 15
  - id: submit
    title: Submit flag
    instructions: CYBERPOD{hydra_ssh_cracked}
    depends_on: [creds]
    extensions:
      points: 20
validator:
  id: local-demo
scoring:
  id: local-demo
flags:
  - id: hydra-flag
    label: Hydra SSH flag
browser:
  required: false
terminal:
  required: false
