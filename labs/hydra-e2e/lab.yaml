schema_version: "1.0"
id: hydra-e2e
name: Hydra E2E
description: Login to score to cleanup acceptance lab.
version: "1.0.0"
difficulty: beginner
estimated_duration_minutes: 10
session_timeout_seconds: 600
required_tools: []
resources: {cpu: 0.5, memory_mb: 128, pids: 32, storage_mb: 128}
networks:
  - {id: training, scope: session, internet: none}
volumes:
  - {id: scratch, ephemeral: true, size_mb: 32}
containers:
  - id: greeting
    image: busybox:1.37.0
    role: target
    command: ["sh", "-c", "echo hello > /scratch/hello; sleep 86400"]
    networks: [training]
    resources: {cpu: 0.5, memory_mb: 128, pids: 32, storage_mb: 64}
    mounts: [{volume: scratch, path: /scratch}]
    healthcheck: {command: ["test", "-f", "/scratch/hello"], interval_seconds: 1, timeout_seconds: 1, retries: 10}
    run_as: "1000:1000"
    read_only_rootfs: true
tasks:
  - {id: crack, title: Recover the vault flag, instructions: Submit the training flag., extensions: {points: 100}}
flags:
  - {id: vault, label: Vault flag, secret_ref: provider-secret}
validator: {id: e2e-validator, config: {}}
scoring: {id: e2e-scoring, config: {}}
browser: {required: false}
terminal: {required: false}
